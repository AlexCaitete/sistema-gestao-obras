<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transição - Carregando Módulo</title>
    <link rel="stylesheet" href="loading-transition.css">
</head>
<body>

    <!-- Container de Tela Cheia Fixo -->
    <div class="loading-overlay">
        <div class="loading-center-box">
            
            <!-- Logo Grande Pulsante -->
            <div class="loading-logo-box">
                <span class="building-icon">🏢</span>
            </div>
            
            <!-- As Três Bolinhas Pulando (Bounce) -->
            <div class="bounce-dots-container">
                <div class="bounce-dot dot-1"></div>
                <div class="bounce-dot dot-2"></div>
                <div class="bounce-dot dot-3"></div>
            </div>
            
            <!-- Texto de Status -->
            <p class="loading-text">Carregando módulo...</p>
            
        </div>
    </div>

</body>
</html>

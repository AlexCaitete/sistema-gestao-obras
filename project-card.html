<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Componente - Project Card</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="project-card.css">
</head>

<body>

    <div class="cards-preview-container">

        <div class="project-card-box">
            <div class="card-header-row">
                <div class="card-title-block">
                    <h3 class="project-title">Edifício Residencial Portal das Flores</h3>
                    <div class="client-info">
                        <span class="icon">🏢</span>
                        <span class="client-name">Construtora Horizonte S.A.</span>
                    </div>
                </div>
                <div class="badge badge-amber">
                    Estrutura
                </div>
            </div>

            <div class="card-body-content">
                <div class="progress-info-row">
                    <div class="progress-label-wrapper">
                        <span class="trend-icon">📈</span>
                        <span class="progress-label">Realizado vs. Previsto</span>
                    </div>
                    <span class="progress-percentage">68%</span>
                </div>

                <div class="progress-bar-root">
                    <div class="progress-bar-indicator" style="width: 68%;"></div>
                </div>

                <div class="card-footer-date">
                    <span class="calendar-icon">📅</span>
                    <span>Início: 01/02/2026</span>
                </div>
            </div>
        </div>

        <div class="project-card-box">
            <div class="card-header-row">
                <div class="card-title-block">
                    <h3 class="project-title">Shopping Center Norte</h3>
                    <div class="client-info">
                        <span class="icon">🏢</span>
                        <span class="client-name">Grupo Investimentos ABC</span>
                    </div>
                </div>
                <div class="badge badge-warning">
                    Fundação
                </div>
            </div>

            <div class="card-body-content">
                <div class="progress-info-row">
                    <div class="progress-label-wrapper">
                        <span class="trend-icon">📈</span>
                        <span class="progress-label">Realizado vs. Previsto</span>
                    </div>
                    <span class="progress-percentage">42%</span>
                </div>

                <div class="progress-bar-root">
                    <div class="progress-bar-indicator" style="width: 42%;"></div>
                </div>

                <div class="card-footer-date">
                    <span class="calendar-icon">📅</span>
                    <span>Início: 15/03/2026</span>
                </div>
            </div>
        </div>

    </div>

</body>

</html>

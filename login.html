<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Gestão de Projetos</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <!-- Container de alinhamento central da tela de login -->
    <div class="login-wrapper">
        <div class="login-container">
            
            <!-- Cabeçalho de Login (Logo e Título) -->
            <header class="login-header">
                <div class="brand-row">
                    <div class="logo-box">🏢</div>
                    <h1 class="brand-title">Empresas Engenharia</h1>
                </div>
                <h2 class="system-subtitle">Sistema de Gestão de Projetos</h2>
                <div class="badge-secure">
                    <span class="badge-dot"></span>
                    <p>Acesso Seguro Multitenancy</p>
                </div>
            </header>

            <!-- Card do Formulário Branco -->
            <div class="login-card">
                <form class="login-form">
                    
                    <!-- Campo Email -->
                    <div class="form-group">
                        <label for="email" class="form-label">Email Corporativo</label>
                        <div class="input-icon-wrapper">
                            <span class="input-icon">✉️</span>
                            <input 
                                type="email" 
                                id="email" 
                                placeholder="seu.email@empresa.com" 
                                required 
                                class="form-input"
                            >
                        </div>
                    </div>

                    <!-- Campo Senha -->
                    <div class="form-group">
                        <label for="password" class="form-label">Senha</label>
                        <div class="input-icon-wrapper">
                            <span class="input-icon">🔒</span>
                            <input 
                                type="password" 
                                id="password" 
                                placeholder="••••••••" 
                                required 
                                class="form-input"
                            >
                        </div>
                    </div>

                    <!-- Botão Submit de Login -->
                    <button type="submit" class="btn-login-submit">
                        <span class="btn-icon">🔒</span> JWT Login Seguro
                    </button>

                    <!-- Link de Recuperação -->
                    <div class="forgot-password-wrapper">
                        <a href="#" class="forgot-link">Esqueceu sua senha?</a>
                    </div>

                </form>
            </div>

            <!-- Informação de Segurança de Rodapé -->
            <p class="footer-security-text">
                Sistema seguro com autenticação JWT e controle de acesso multitenancy
            </p>

        </div>
    </div>

</body>
</html>
